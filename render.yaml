# Render Blueprint for WasteLess: the API (apps/Server) and the web app
# (apps/Client, a static site).
#
# Fresh deploy: Render Dashboard -> New -> Blueprint -> pick this repository.
# Render asks for every "sync: false" value when it creates each service;
# anything left empty can be set later under that service's Environment tab.
#
# Connecting the two takes two values:
#   - client VITE_BASE_URL = the API's public URL, e.g.
#     https://wasteless-api.onrender.com (Render adds a suffix if the name was
#     taken; check the API's page in the dashboard).
#   - api CLIENT_URL = the web app's public URL, for links in emails.
# The API already allows https://wasteless-client*.onrender.com and the old
# foodwastereduction*.vercel.app site, so no CORS setting is needed for those.

services:
  - type: web
    name: wasteless-api
    runtime: node
    plan: free
    region: frankfurt
    # The repo is an npm workspace with one lockfile at the root, so install
    # and build from the root. --include=dev keeps TypeScript available even
    # though NODE_ENV is production.
    buildCommand: npm ci --include=dev && npm run build -w @wasteless/server
    startCommand: npm run start -w @wasteless/server
    healthCheckPath: /
    # Skip deploys for changes that can't affect the API.
    buildFilter:
      paths:
        - apps/Server/**
        - packages/shared/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Render puts one proxy in front of the app (used by the rate limiter).
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: APP_TIMEZONE
        value: Africa/Lagos

      # Database (MongoDB Atlas). In Atlas > Network Access, allow 0.0.0.0/0:
      # Render's free services don't have fixed outbound IPs.
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        sync: false

      # Auth. Generated once by Render; changing it signs everyone out.
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false

      # The web app's public URL, for links in emails.
      - key: CLIENT_URL
        sync: false
      # Any other allowed browser origins (e.g. a custom domain), comma separated.
      - key: CORS_ORIGINS
        sync: false

      # Listing photos.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Email. Render's free plan blocks outgoing SMTP, so production uses Brevo.
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

      # Optional: AI recipe ideas in the pantry. Without it, a built-in guide is used.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

  # The React app, served as static files. Static sites are free and don't
  # sleep, unlike free web services.
  - type: web
    name: wasteless-client
    runtime: static
    buildCommand: npm ci --include=dev && npm run build -w @wasteless/client
    staticPublishPath: ./apps/Client/dist
    buildFilter:
      paths:
        - apps/Client/**
        - packages/shared/**
        - package.json
        - package-lock.json
        - render.yaml
    # The app does its own routing, so every path serves index.html
    # (/pantry, /donations/... would otherwise 404 on refresh).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Built assets have content hashes in their names, so cache them forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    # VITE_* values are baked in at build time: redeploy after changing them.
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_BASE_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
